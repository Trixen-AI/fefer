openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: keeper
    description: Delta LP keeper operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /keeper/status:
    get:
      operationId: keeperStatus
      tags: [keeper]
      summary: Keeper status
      description: Returns configuration and polling status without exposing credentials
      responses:
        "200":
          description: Current keeper status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeeperStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KeeperStatus:
      type: object
      properties:
        configured:
          type: boolean
        running:
          type: boolean
        operatorAddress:
          type:
            - string
            - "null"
        contractAddress:
          type:
            - string
            - "null"
        activeMandates:
          type: number
          minimum: 0
        lastPollAt:
          type:
            - string
            - "null"
          format: date-time
        lastTransactionHash:
          type:
            - string
            - "null"
        lastError:
          type:
            - string
            - "null"
      required:
        - configured
        - running
        - operatorAddress
        - contractAddress
        - activeMandates
        - lastPollAt
        - lastTransactionHash
        - lastError


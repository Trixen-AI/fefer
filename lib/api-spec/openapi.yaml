openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: keeper
    description: Liqora keeper operations
  - name: market
    description: Public crypto market data
  - name: chain
    description: Restricted Robinhood Chain operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /keeper/status:
    get:
      operationId: keeperStatus
      tags: [keeper]
      summary: Keeper status
      description: Returns configuration and polling status without exposing credentials
      responses:
        "200":
          description: Current keeper status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeeperStatus"
  /market/prices:
    get:
      operationId: marketPrices
      tags: [market]
      summary: Live crypto prices
      description: Returns current USD prices and 24-hour changes for selected crypto assets
      responses:
        "200":
          description: Current market prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPricesPayload"
        "502":
          description: Market data provider unavailable
  /chain/simulate-mint:
    post:
      operationId: simulateMint
      tags: [chain]
      summary: Simulate a position mint
      description: Simulates a mint against the configured position manager without submitting a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintSimulationInput"
      responses:
        "200":
          description: Encoded mint simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintSimulationResult"
        "400":
          description: Invalid simulation request
        "502":
          description: Chain RPC rejected the simulation
  /chain/positions/{owner}:
    get:
      operationId: chainPositions
      tags: [chain]
      summary: List position NFTs owned by a wallet
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Position NFT data from the configured position manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainPositionsPayload"
        "400":
          description: Invalid owner address
        "502":
          description: Chain RPC unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    KeeperStatus:
      type: object
      properties:
        configured:
          type: boolean
        running:
          type: boolean
        operatorAddress:
          type:
            - string
            - "null"
        contractAddress:
          type:
            - string
            - "null"
        activeMandates:
          type: number
          minimum: 0
        lastPollAt:
          type:
            - string
            - "null"
          format: date-time
        lastTransactionHash:
          type:
            - string
            - "null"
        lastError:
          type:
            - string
            - "null"
      required:
        - configured
        - running
        - operatorAddress
        - contractAddress
        - activeMandates
        - lastPollAt
        - lastTransactionHash
        - lastError
    MarketPrice:
      type: object
      properties:
        symbol:
          type: string
        priceUsd:
          type: number
          minimum: 0
        change24h:
          type:
            - number
            - "null"
      required:
        - symbol
        - priceUsd
        - change24h
    MarketPricesPayload:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/MarketPrice"
        updatedAt:
          type: string
          format: date-time
      required:
        - prices
        - updatedAt
    MintSimulationInput:
      type: object
      properties:
        from:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
        data:
          type: string
          pattern: "^0x[a-fA-F0-9]+$"
          maxLength: 4096
      required:
        - from
        - data
    MintSimulationResult:
      type: object
      properties:
        result:
          type: string
          pattern: "^0x[a-fA-F0-9]*$"
      required:
        - result
    ChainPositionData:
      type: object
      properties:
        tokenId:
          type: string
          pattern: "^[0-9]+$"
        data:
          type: string
          pattern: "^0x[a-fA-F0-9]*$"
      required:
        - tokenId
        - data
    ChainPositionsPayload:
      type: object
      properties:
        totalCount:
          type: number
          minimum: 0
        positions:
          type: array
          items:
            $ref: "#/components/schemas/ChainPositionData"
      required:
        - totalCount
        - positions


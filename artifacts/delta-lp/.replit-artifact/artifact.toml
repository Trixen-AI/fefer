kind = "web"
previewPath = "/"
title = "Delta LP"
description = "A premium Web3 interface for creating concentrated liquidity positions and configuring automated take-profit exits on Robinhood Chain."
version = "1.0.0"
id = "artifacts/delta-lp"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25278

[services.development]
run = "pnpm --filter @workspace/delta-lp run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/delta-lp", "run", "build" ]
serve = "static"
publicDir = "artifacts/delta-lp/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25278"
BASE_PATH = "/"
VITE_CHAIN_ID = "4663"
VITE_RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
VITE_CHAIN_NAME = "Robinhood Chain"
VITE_NATIVE_CURRENCY_NAME = "Ether"
VITE_NATIVE_CURRENCY_SYMBOL = "ETH"
VITE_BLOCK_EXPLORER_URL = "https://robinhoodchain.blockscout.com"
VITE_UNISWAP_V3_POSITION_MANAGER = "0x73991a25c818bf1f1128deaab1492d45638de0d3"
VITE_UNISWAP_V3_FACTORY = "0x1f7d7550b1b028f7571e69a784071f0205fd2efa"
VITE_LP_TOKEN0_ADDRESS = "0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73"
VITE_LP_TOKEN1_ADDRESS = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
VITE_LP_TOKEN0_LABEL = "WETH"
VITE_LP_TOKEN1_LABEL = "USDG"
